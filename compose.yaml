name: repopulse

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repopulse
      POSTGRES_USER: repopulse_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run db:setup in server first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopulse_owner -d repopulse"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
